openapi: 3.0.3
info:
  title: 'Reservation API Documentation'
  description: '線上預約系統 API：資源／時段管理、預約與併發搶位控制、Stripe 金流 Webhook。'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: ''
  -
    name: Bookings
    description: "\nReserving and cancelling a seat on a time slot."
  -
    name: 'Payment Webhooks'
    description: "\nCalled directly by Stripe, not by API clients. Authenticated by verifying\nthe `Stripe-Signature` header rather than a Sanctum token."
  -
    name: Resources
    description: "\nBookable resources (e.g. a class or a room). Reading requires any\nauthenticated user; creating, updating, and deleting require an admin."
  -
    name: 'Time Slots'
    description: "\nBookable time slots for a resource. Reading requires any authenticated\nuser; creating, updating, and deleting require an admin."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: '透過 <code>POST /api/v1/register</code> 或 <code>POST /api/v1/login</code> 取得 Sanctum token，並帶在 <code>Authorization: Bearer {token}</code>。'
security:
  -
    default: []
paths:
  /api/v1/register:
    post:
      summary: Register
      operationId: register
      description: 'Create a new user account and return a Sanctum API token.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    id: 1
                    name: 'Jane Doe'
                    email: jane@example.com
                    role: user
                  token: 1|abcdef1234567890
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Jane Doe'
                      email:
                        type: string
                        example: jane@example.com
                      role:
                        type: string
                        example: user
                  token:
                    type: string
                    example: 1|abcdef1234567890
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - name
                - email
                - password
      security: []
  /api/v1/login:
    post:
      summary: Login
      operationId: login
      description: 'Exchange email/password credentials for a new Sanctum API token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  user:
                    id: 1
                    name: 'Jane Doe'
                    email: jane@example.com
                    role: user
                  token: 2|abcdef1234567890
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Jane Doe'
                      email:
                        type: string
                        example: jane@example.com
                      role:
                        type: string
                        example: user
                  token:
                    type: string
                    example: 2|abcdef1234567890
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The provided credentials are incorrect.'
                properties:
                  message:
                    type: string
                    example: 'The provided credentials are incorrect.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - password
      security: []
  /api/v1/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Revoke the token used to authenticate the current request.'
